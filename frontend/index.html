<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
  <title>JARVIS</title>
  <script type="module" src="/src/main.ts"></script>
</head>

<body>
  <canvas id="orb-canvas"></canvas>

  <!-- Webcam HUD (Left side) -->
  <div id="webcam-hud" class="hidden">
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="webcam-canvas"
      style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;border-radius:inherit;"></canvas>
    <img id="webcam-overlay"
      style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;display:none;pointer-events:none;border-radius:inherit;" />
    <div class="hud-label-cam">CAM-01 ACTIVE</div>
    <select id="webcam-device-select" class="hud-cam-select" title="Chọn thiết bị camera"></select>
    <div class="hud-dots-container">
      <div class="hud-dot-pulse"></div>
      <span>LIVE FEED</span>
    </div>
  </div>
  <!-- Minimal controls — top right -->
  <div id="controls">
    <button id="btn-controls" title="Menu điều khiển" aria-label="Menu điều khiển" aria-controls="controls" aria-expanded="false"></button>
    <button id="btn-webcam-toggle" title="Mở/Đóng Webcam"></button>
    <button id="btn-mute" title="Mute/Unmute"></button>
    <button id="btn-tts-toggle" title="Bật/Tắt âm thanh phản hồi (TTS)"></button>
    <button id="btn-cmd-bar" title="Toggle Command Bar (Ctrl+K)"></button>
    <button id="btn-orb-toggle" title="Tắt orb (ngừng vẽ, trả GPU)" aria-pressed="true"></button>
  </div>

  <!-- Command input area — centered bottom -->
  <div id="command-container">
    <div id="chat-history"></div>
    <div id="command-suggest" class="hidden"></div>
    <div id="status-row">
      <div id="status-orb" aria-hidden="true"></div>
      <div id="status-text"></div>
    </div>
    <div id="command-bar">
      <div id="command-bar-inner">
        <button id="btn-upload" title="Upload File"></button>
        <div id="file-pinned-container" style="display:none">
          <span id="file-pinned-name"></span>
          <button id="btn-file-remove">✕</button>
        </div>
        <textarea id="command-input" placeholder="Nhập nội dung, / hành động, @ gọi tên" autocomplete="off"
          spellcheck="false" rows="1"></textarea>
        <input type="file" id="file-upload" style="display:none" />
        <span id="cmd-send-wrap"><button id="cmd-send" title="Send (Enter)"></button></span>
      </div>
    </div>
  </div>
  <div id="jarvis-label">JARVIS</div>
  <div id="error-text" class="island" data-state="hidden"></div>
  <div id="media-player" class="media-player hidden">
    <div id="media-player-inner"></div>
  </div>

</body>

</html>
