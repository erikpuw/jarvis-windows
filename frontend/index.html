<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>JARVIS</title>
  <script type="module" src="/src/main.ts"></script>
</head>

<body>
  <canvas id="orb-canvas"></canvas>

  <!-- Webcam HUD (Left side) -->
  <div id="webcam-hud" class="hidden">
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="webcam-canvas"
      style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;border-radius:inherit;"></canvas>
    <img id="webcam-overlay"
      style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;display:none;pointer-events:none;border-radius:inherit;" />
    <div class="hud-label-cam">CAM-01 ACTIVE</div>
    <select id="webcam-device-select" class="hud-cam-select" title="Chọn thiết bị camera"></select>
    <button id="btn-webcam-fullscreen" class="hud-cam-fullscreen-btn" title="Xem toàn màn hình (Lớp nền)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
      </svg>
    </button>
    <div class="hud-dots-container">
      <div class="hud-dot-pulse"></div>
      <span>LIVE FEED</span>
    </div>
  </div>
  <!-- Minimal controls — top right -->
  <div id="controls">
    <button id="btn-webcam-toggle" title="Mở/Đóng Webcam"></button>
    <button id="btn-mute" title="Mute/Unmute"></button>
    <button id="btn-tts-toggle" title="Bật/Tắt âm thanh phản hồi (TTS)"></button>
    <button id="btn-cmd-bar" title="Toggle Command Bar (Ctrl+K)"></button>
    <button id="btn-orb-toggle" title="Tắt orb (ngừng vẽ, trả GPU)" aria-pressed="true"></button>
    <button id="btn-map" title="Bản đồ & Vị trí"></button>
    <button id="btn-menu" title="Menu"></button>
  </div>

  <!-- Dropdown menu -->
  <div id="menu-dropdown" style="display:none">
    <button id="btn-settings">Settings</button>
    <button id="btn-restart">Restart Server</button>
  </div>

  <!-- Command input area — centered bottom -->
  <div id="command-container">
    <div id="chat-history"></div>
    <div id="command-suggest" class="hidden"></div>
    <div id="status-row">
      <div id="status-orb" aria-hidden="true"></div>
      <div id="status-text"></div>
    </div>
    <div id="command-bar">
      <div id="command-bar-inner">
        <button id="btn-upload" title="Upload File"></button>
        <div id="file-pinned-container" style="display:none">
          <span id="file-pinned-name"></span>
          <button id="btn-file-remove">✕</button>
        </div>
        <textarea id="command-input" placeholder="Nhập nội dung, / hành động, @ gọi tên" autocomplete="off"
          spellcheck="false" rows="1"></textarea>
        <input type="file" id="file-upload" style="display:none" />
        <span id="cmd-send-wrap"><button id="cmd-send" title="Send (Enter)"></button></span>
      </div>
    </div>
  </div>
  <div id="jarvis-label">JARVIS</div>
  <div id="error-text"></div>
  <div id="media-player" class="media-player hidden">
    <div id="media-player-inner"></div>
  </div>

  <!-- Map Panel (Dual Mode: Mini / Full) -->
  <div id="map-panel" class="hidden mini-mode">
    <div class="map-body">
      <div id="map-container"></div>

      <!-- Controls aligned to the left of or inside the map -->
      <div class="map-controls-left">
        <button id="btn-map-full" title="Toàn màn hình">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
          </svg>
        </button>
        <button id="btn-map-3d" title="Chế độ 3D">3D</button>
        <button id="btn-map-globe" title="Chế độ Quả cầu">GLOBE</button>
        <button id="btn-map-pin" title="Ghim vị trí">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </button>
        <button id="btn-map-locate" title="Vị trí của tôi">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          </svg>
        </button>
        <button id="btn-map-saved" title="Vị trí đã lưu">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Search bar at the bottom of the map area -->
      <div class="map-search-bottom">
        <input type="text" id="map-search-input" placeholder="Dò tìm vị trí..." autocomplete="off" />
        <button id="btn-map-search-go">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>

      <!-- Coordinates HUD -->
      <div class="map-coord-hud">
        <span id="map-lat">0.0000</span> | <span id="map-lng">0.0000</span>
      </div>

      <!-- Custom Dialog to Save Pin -->
      <div id="map-prompt-modal" class="hidden">
        <div class="map-prompt-title">GHIM VỊ TRÍ MỚI</div>
        <input type="text" id="map-prompt-input" placeholder="Nhập tên vị trí..." autocomplete="off" />
        <div class="map-prompt-buttons">
          <button id="btn-map-prompt-cancel">HỦY</button>
          <button id="btn-map-prompt-save">LƯU</button>
        </div>
      </div>

      <button id="btn-close-map" class="map-exit-btn">&times;</button>
    </div>
  </div>

</body>

</html>
