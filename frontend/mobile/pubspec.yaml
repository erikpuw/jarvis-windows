name: jarvis_mobile
description: "JARVIS mobile client"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3
  markdown_widget: ^2.3.2+8
  lucide_icons_flutter: ^4.0.0
  provider: ^6.1.5+1
  highlight: ^0.7.0
  file_picker: ^13.1.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  speech_to_text: ^7.5.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  clock: ^1.1.3
  flutter_pcm_sound: ^3.3.3
  audio_session: ^0.2.4
  shorebird_code_push: ^2.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  stream_channel: ^2.1.4
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/sounds/
    - shorebird.yaml
  shaders:
    - shaders/liquid_metal.frag
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
          weight: 400
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-512.png
  remove_alpha_ios: true
  background_color_ios: "#050508"
  adaptive_icon_background: "#050508"
  adaptive_icon_foreground_inset: 0 # the maskable source already has its safe zone
  adaptive_icon_foreground: assets/icon/icon-maskable-512.png
