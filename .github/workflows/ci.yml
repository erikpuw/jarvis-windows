name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + compile + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Không cài requirements.txt: nhiều gói chỉ chạy trên Windows (pywinauto, pywin32)
      # hoặc rất nặng (mediapipe, faster-whisper). Các bước dưới chỉ cần ruff + stdlib.
      - name: Cài ruff
        run: pip install ruff
      - name: Ruff (cấu hình trong ruff.toml)
        run: ruff check . --output-format github
      - name: Compile toàn bộ Python
        run: python -m compileall -q server.py engine hooks plugins
      - name: Kiểm tra import nội bộ
        run: python .github/scripts/check_imports.py

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # bsdtar: engine/tools/archive_tool.py dùng nó để đọc zip/7z (trên Windows là System32\tar.exe)
      - name: Cài bsdtar
        run: sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools
      # requirements-ci.txt: bộ nhẹ (~1 phút). Không cài requirements.txt vì kéo theo ~5GB torch/CUDA.
      - name: Cài dependency
        run: pip install -r requirements-ci.txt
      # tests/live và tests/test_live_*.py gọi llama-server thật nên không chạy trên CI
      - name: pytest
        run: python -m pytest tests -q --ignore=tests/live --ignore-glob='tests/test_live_*'

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc + vite build
        run: npm run build
